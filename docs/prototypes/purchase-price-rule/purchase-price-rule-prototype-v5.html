<style>

<script>
/* ═════════════════════════ DATA (mock) ═════════════════════════ */
const SEED = () => ({
  categories: ['Bahan Baku', 'Bumbu', 'Kemasan'],
  products: [
    { id: 'P01', name: 'Mie Basah 1 kg', category: 'Bahan Baku', buy: 18000, sell: 24000 },
    { id: 'P02', name: 'Tepung Terigu 25 kg', category: 'Bahan Baku', buy: 210000, sell: 245000 },
    { id: 'P03', name: 'Daging Ayam Fillet 1 kg', category: 'Bahan Baku', buy: 38000, sell: 46000 },
    { id: 'P04', name: 'Sawi Hijau 1 kg', category: 'Bahan Baku', buy: 12000, sell: 16000 },
    { id: 'P05', name: 'Bawang Putih 1 kg', category: 'Bumbu', buy: 35000, sell: 42000 },
    { id: 'P06', name: 'Kecap Manis 5 L', category: 'Bumbu', buy: 95000, sell: 112000 },
    { id: 'P07', name: 'Cup Kertas 1.000 pcs', category: 'Kemasan', buy: 450000, sell: 520000 },
    { id: 'P08', name: 'Kantong Plastik 1 kg', category: 'Kemasan', buy: 40000, sell: 48000 },
  ],

    { id: 'V1', name: 'Central Kitchen Bandung', pkp: true },
    { id: 'V2', name: 'Central Kitchen Jakarta', pkp: true },
    { id: 'V3', name: 'UD Sumber Sayur', pkp: false },
    { id: 'V4', name: 'PT Kemasan Prima', pkp: true },
  ],
  customers: [
    { id: 'C1', name: 'Outlet Dago' },
    { id: 'C2', name: 'Outlet Kemang' },
    { id: 'C3', name: 'Catering Sejahtera' },
  ],
  // id order = age (higher = newer). Ties inside a precedence level go to the newest rule.
  rules: [
    { id: 101, name: 'CK Bandung · Outlet Kemang deal', tx: 'purchase', type: 'fixed_price', amount: 0, tiers: [], prices: { P01: 16000, P03: 35000 }, products: ['P01', 'P03'], categories: [], contacts: ['V1'], allow: false, active: true, start: '', end: '' },
    { id: 102, name: 'CK Bandung · price list Nov 2026', tx: 'purchase', type: 'fixed_price', amount: 0, tiers: [], prices: { P01: 16500, P02: 198000, P03: 36000 }, products: ['P01', 'P02', 'P03'], categories: [], contacts: ['V1'], allow: false, active: true, start: '2026-11-01', end: '' },
    { id: 103, name: 'CK Jakarta · price list Nov 2026', tx: 'purchase', type: 'fixed_price', amount: 0, tiers: [], prices: { P01: 17250, P03: 37000 }, products: ['P01', 'P03'], categories: [], contacts: ['V2'], allow: false, active: true, start: '2026-11-01', end: '' },
    { id: 104, name: 'CK Bandung · bumbu 5%', tx: 'purchase', type: 'percent', amount: 5, tiers: [], prices: {}, products: [], categories: ['Bumbu'], contacts: ['V1'], allow: true, active: true, start: '', end: '' },
    { id: 105, name: 'Sumber Sayur · all products 3%', tx: 'purchase', type: 'percent', amount: 3, tiers: [], prices: {}, products: [], categories: [], contacts: ['V3'], allow: true, active: true, start: '', end: '' },
    { id: 106, name: 'Kemasan Prima · cup volume tiers', tx: 'purchase', type: 'tier', amount: 0, tiers: [{ t: 10, d: 5 }, { t: 50, d: 8 }], prices: {}, products: ['P07'], categories: [], contacts: ['V4'], allow: false, active: true, start: '', end: '' },
    { id: 107, name: 'All vendors · kemasan Rp 2.000/unit', tx: 'purchase', type: 'value', amount: 2000, tiers: [], prices: {}, products: [], categories: ['Kemasan'], contacts: [], allow: true, active: true, start: '', end: '' },
    { id: 108, name: 'Outlet Kemang · markup 10%', tx: 'sales', type: 'markup_percent', amount: 10, tiers: [], prices: {}, products: [], categories: [], contacts: ['C2'], allow: true, active: true, start: '', end: '' },
    { id: 109, name: 'All customers · bahan baku subtotal tiers', tx: 'sales', type: 'subtotal_tier', amount: 0, tiers: [{ t: 1000000, d: 2 }, { t: 5000000, d: 4 }], prices: {}, products: [], categories: ['Bahan Baku'], contacts: [], allow: true, active: true, start: '', end: '' },
    { id: 110, name: 'Catering Sejahtera · price list', tx: 'sales', type: 'fixed_price', amount: 0, tiers: [], prices: { P02: 238000, P06: 105000 }, products: ['P02', 'P06'], categories: [], contacts: ['C3'], allow: false, active: true, start: '', end: '' },
  ],
});
let DB = SEED();
let nextRuleId = 200, nextProdId = 9;

/* ═════════════════════════ PRODUCT LABELS ═════════════════════════ */
const PROD = {
  jurnal: {
    brand: 'mekari jurnal', logo: 'J', rulesPath: 'Products › Price rules',
    types: { percent: 'Discount percentage', value: 'Discount value', tier: 'Tiered discount', subtotal_tier: 'Subtotal tiered discount', end_discount: 'End discount', markup_percent: 'Markup percentage', markup_value: 'Markup value', fixed_price: 'Fixed price per product' },
    unit: { purchase: 'Unit price', sales: 'Unit price' },
    nav: [['', [['dashboard', 'Dashboard'], ['sales', 'Sales'], ['purchases', 'Purchases'], ['products', 'Products'], ['rules', 'Price rules'], ['vendors', 'Contacts (vendors)']]]],
    docs: { po: 'Purchase Order', pi: 'Purchase Invoice', so: 'Sales Order' },
  },
  erp: {
    brand: 'Mekari ERP', logo: 'E', rulesPath: 'Inventory › Price rules',
    types: { percent: 'Percentage discount', value: 'Price amount discount', tier: 'Tier percentage discount', subtotal_tier: 'Subtotal discount', end_discount: 'Last price discount', markup_percent: 'Percentage markup', markup_value: 'Price amount markup', fixed_price: 'Fixed price per product' },
    unit: { purchase: 'Unit cost', sales: 'Unit price' },
    nav: [['Sales', [['sales', 'Sales orders']]], ['Purchase', [['purchases', 'Purchase orders / invoices']]], ['Inventory', [['products', 'Products'], ['rules', 'Price rules']]], ['Contacts', [['vendors', 'Vendors']]]],
    docs: { po: 'Purchase order', pi: 'Purchase invoice', so: 'Sales order' },
  },
};
const TYPE_ORDER = ['percent', 'value', 'tier', 'subtotal_tier', 'end_discount', 'fixed_price', 'markup_percent', 'markup_value'];
const SHAPE = { percent: 'pct', markup_percent: 'pct', value: 'amt', markup_value: 'amt', end_discount: 'amt', tier: 'tier', subtotal_tier: 'tier', fixed_price: 'list' };
const LEVEL = { 1: 'Contact + product', 2: 'Contact + category', 3: 'Contact only', 4: 'Product only', 5: 'Category only' };
const levelLabel = (lvl, tx) => LEVEL[lvl].replace('Contact', tx === 'purchase' ? 'Vendor' : 'Customer');

/* ═════════════════════════ ENGINE (same for sales and purchase) ═════════════════════════
   Precedence (no stacking): 1 contact+product › 2 contact+category › 3 contact+all products ›
   4 product only › 5 category only. Ties → newest rule. A picked rule wins on lines it covers.
   Category is a LIVE scope: membership is read at transaction time.                          */
const prod = (id) => DB.products.find((p) => p.id === id);
const ruleById = (id) => DB.rules.find((r) => r.id === id);
function inPeriod(r, iso) { return (!r.start || iso >= r.start) && (!r.end || iso <= r.end); }
function levelFor(r, contactId, pid) {
  const hasC = r.contacts.length > 0;
  if (hasC && !r.contacts.includes(contactId)) return null;
  if (r.type === 'fixed_price') return pid in r.prices ? (hasC ? 1 : 4) : null;
  if (r.products.includes(pid)) return hasC ? 1 : 4;
  const cat = prod(pid)?.category;
  if (cat && r.categories.includes(cat)) return hasC ? 2 : 5;
  if (!r.products.length && !r.categories.length && hasC) return 3;
  return null;
}
function activeRules(tx, iso) { return DB.rules.filter((r) => r.tx === tx && r.active && inPeriod(r, iso)); }
function ruleOptions(tx, contactId, iso) {
  if (!contactId) return [];
  return activeRules(tx, iso).filter((r) => (!r.contacts.length || r.contacts.includes(contactId)) && (r.contacts.length || r.products.length || r.categories.length)).sort((a, b) => b.id - a.id);
}
function step(r, measure) { return [...r.tiers].sort((a, b) => b.t - a.t).find((s) => measure >= s.t)?.d ?? 0; }
function applyRule(r, base, qty, docSub, pid) {
  switch (r.type) {
    case 'percent': return { price: base, disc: r.amount };
    case 'value': return { price: base, disc: base > 0 ? Math.round((r.amount / base) * 10000) / 100 : 0 };
    case 'tier': return { price: base, disc: step(r, qty) };
    case 'subtotal_tier': return { price: base, disc: step(r, docSub) };
    case 'end_discount': return { price: r.amount, disc: 0 };
    case 'markup_percent': return { price: Math.round(base * (1 + r.amount / 100)), disc: 0 };
    case 'markup_value': return { price: base + r.amount, disc: 0 };
    case 'fixed_price': return { price: r.prices[pid] ?? base, disc: 0 };
  }
}
function resolve({ tx, contactId, pid, base, qty, docSub, iso, pick }) {
  if (!contactId || !pid || pick === 'none') return null;
  const rules = activeRules(tx, iso);
  let chosen = null;
  if (pick !== 'auto') {
    const r = rules.find((x) => x.id === pick); const lvl = r ? levelFor(r, contactId, pid) : null;
    if (lvl) chosen = { rule: r, level: lvl, picked: true };
  }
  if (!chosen) {
    const best = rules.map((rule) => ({ rule, level: levelFor(rule, contactId, pid) })).filter((c) => c.level).sort((a, b) => a.level - b.level || b.rule.id - a.rule.id)[0];
    if (best) chosen = { ...best, picked: false };
  }
  if (!chosen) return null;
  const out = applyRule(chosen.rule, base, qty, docSub, pid);
  return { ...chosen, price: out.price, disc: Math.min(Math.max(out.disc, 0), 100), editable: chosen.rule.allow };
}

/* ═════════════════════════ STATE / UTIL ═════════════════════════ */
const S = { product: 'jurnal', page: 'rules', filter: 'all', search: '', form: null, formErr: {}, tx: null, guide: true };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = (n) => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const pct = (n) => (Math.round(n * 100) / 100).toLocaleString('id-ID') + '%';
const L = () => PROD[S.product];
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
const today = '2026-11-19';
const contactsOf = (tx) => (tx === 'purchase' ? DB.vendors : DB.customers);
const contactName = (tx, id) => contactsOf(tx).find((c) => c.id === id)?.name ?? id;

/* ═════════════════════════ RENDER: chrome ═════════════════════════ */
function render() {
  document.getElementById('app').className = 'app ' + S.product;
  $('#brandName').textContent = L().brand; $('#logo').textContent = L().logo;
  document.querySelectorAll('#prodSeg button').forEach((b) => b.classList.toggle('on', b.dataset.p === S.product));
  const navKey = S.page === 'ruleForm' ? 'rules' : S.page === 'tx' ? (S.tx?.doc === 'so' ? 'sales' : 'purchases') : S.page;
  $('#nav').innerHTML = L().nav.map(([g, items]) => (g ? `<div class="grp">${g}</div>` : '') + items.map(([k, t]) => `<a data-nav="${k}" class="${navKey === k ? 'on' : ''}"><span class="dot"></span>${t}</a>`).join('')).join('');
  $('#crumb').textContent = { rules: L().rulesPath, ruleForm: L().rulesPath + (S.form?.id ? ' › Edit' : ' › New'), tx: S.tx ? (S.tx.doc === 'so' ? 'Sales' : 'Purchases') + ' › New ' + L().docs[S.tx.doc] : '', vendors: 'Contacts › Vendors', products: 'Products', sales: 'Sales', purchases: 'Purchases', dashboard: 'Dashboard' }[S.page] || '';
  const pg = $('#page');
  ({ rules: renderRules, ruleForm: renderForm, tx: renderTx, vendors: renderVendors, products: renderProducts, sales: () => openTx('so'), purchases: () => openTx('po'), dashboard: renderDash })[S.page](pg);
  renderGuide();
}
function go(page) { S.page = page; render(); }

/* ═════════════════════════ PAGE: price rules list ═════════════════════════ */
function scopeText(r) {
  const parts = [];

  else if (!r.products.length && !r.categories.length) parts.push('All products');
  else { if (r.categories.length) parts.push(`${r.categories.length} categor${r.categories.length > 1 ? 'ies' : 'y'} (${r.categories.join(', ')})`); if (r.products.length) parts.push(`${r.products.length} product${r.products.length > 1 ? 's' : ''}`); }
  return parts.join(' · ');
}
function contactText(r) {
  const noun = r.tx === 'purchase' ? 'vendor' : 'customer';
  if (!r.contacts.length) return `All ${noun}s`;
  if (r.contacts.length === 1) return contactName(r.tx, r.contacts[0]);
  return `${r.contacts.length} ${noun}s`;
}

  }
}

function saveRule() {
  const f = S.form, e = {};
  if (!f.name.trim()) e.name = 'Rule name is required';
  if (!f.allContacts && !f.contacts.length) e.contacts = 'Pick at least one contact';
  if (f.type === 'fixed_price') {
    if (!f.products.length) e.products = 'Pick at least one product';
    f.products.forEach((id) => { if (!(Number(f.prices[id]) > 0)) { e['price_' + id] = 'Enter a fixed price above 0 for every product'; } });
  } else if (!f.allProducts && !f.products.length && !f.categories.length) e.products = 'Pick a category or a product';
  if (SHAPE[f.type] === 'tier') { const ts = f.tiers.map((t) => Number(t.t)); if (!f.tiers.length || ts.some((t, i) => t <= 0 || (i && t <= ts[i - 1])) || f.tiers.some((t) => t.d < 0 || t.d > 100)) e.tiers = 'Tier minimums must be above 0 and go up row by row; discounts 0–100'; }
  S.formErr = e; if (Object.keys(e).length) return render();
  const list = f.type === 'fixed_price';
  const rule = { id: f.id ?? nextRuleId++, name: f.name.trim(), tx: f.tx, type: f.type, amount: Number(f.amount) || 0, tiers: SHAPE[f.type] === 'tier' ? f.tiers.map((t) => ({ t: Number(t.t), d: Number(t.d) })) : [],
    prices: list ? Object.fromEntries(f.products.map((id) => [id, Number(f.prices[id])])) : {}, products: list || !f.allProducts ? [...f.products] : [], categories: !list && !f.allProducts ? [...f.categories] : [],
    contacts: f.allContacts ? [] : [...f.contacts], allow: f.allow, active: f.active, start: f.start, end: f.end };
  const i = DB.rules.findIndex((r) => r.id === rule.id); if (i >= 0) DB.rules[i] = rule; else DB.rules.push(rule);
  toast(f.id ? 'Price rule updated' : 'Price rule created'); S.form = null; go('rules');
}

function openTx(doc) { S.tx = { doc, contact: '', pick: 'auto', lines: [] }; S.page = 'tx'; render(); }
const txType = () => (S.tx.doc === 'so' ? 'sales' : 'purchase');
function baseOf(pid) { const p = prod(pid); return txType() === 'purchase' ? p.buy : p.sell; }
function reapply(force = false) {
  const t = S.tx, tx = txType();
  const docSub = t.lines.reduce((s, l) => s + (l.pid ? baseOf(l.pid) * l.qty : 0), 0);
  for (let pass = 0; pass < 2; pass++) t.lines.forEach((l) => {
    if (!l.pid) return;
    const m = resolve({ tx, contactId: t.contact, pid: l.pid, base: baseOf(l.pid), qty: l.qty, docSub, iso: today, pick: t.pick });
    if (m && !m.editable) l.manual = false;
    if (l.manual && !force) { l.match = m; return; }
    l.match = m; l.manual = false;
    if (m) { l.price = m.price; l.disc = m.disc; } else { l.price = baseOf(l.pid); l.disc = 0; }
  });
}
function vendorPkp() { if (txType() !== 'purchase' || !S.tx.contact) return null; return DB.vendors.find((v) => v.id === S.tx.contact)?.pkp ?? null; }
function lineTax(l) { if (!l.pid) return { label: '—', rate: 0, np: false }; if (vendorPkp() === false) return { label: 'Non-taxable', rate: 0, np: true }; return { label: 'PPN 11%', rate: 11, np: false }; }

      <div><label class="f">Price rule ${tx === 'sales' ? '<span class="badge b-p1">P1</span>' : ''}</label><select class="inp" data-txpick ${t.contact ? '' : 'disabled'}><option value="auto" ${t.pick === 'auto' ? 'selected' : ''}>Automatic</option>${opts.map((r) => `<option value="${r.id}" ${t.pick === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}<option value="none" ${t.pick === 'none' ? 'selected' : ''}>No price rule</option></select>
        <div class="help">Automatic picks the best rule per line. Pick a rule to use it on every line it covers.</div></div>
      <div><label class="f">Transaction date</label><input class="inp" value="19/11/2026" readonly></div>
      <div><label class="f">Warehouse</label><select class="inp"><option>Outlet Kemang</option><option>Outlet Dago</option><option>Gudang Pusat</option></select></div>
    </div>
    <div style="padding:8px 16px 0;overflow:auto"><table class="tx-lines"><thead><tr><th style="width:26%">Product</th><th style="width:9%">Qty</th><th class="r" style="width:16%">${L().unit[tx]}</th><th class="r" style="width:11%">Discount (%)</th><th style="width:13%">Tax</th><th class="r" style="width:15%">Amount</th><th></th></tr></thead><tbody>

  </div>`;
}

  { t: 'Price list (Fixed price per product)', e: 'CK Bandung + Mie Basah → Rp 16.500 from the Nov price list, locked. Tepung → Rp 198.000.', ac: 'AC7a · AC8', run: () => { openTx('po'); S.tx.contact = 'V1'; addLine('P01', 10); addLine('P02', 2); reapply(true); render(); } },
  { t: 'Pick a rule on the transaction (outlet deal)', e: 'Price rule → "CK Bandung · Outlet Kemang deal": Mie Basah Rp 16.000 (Picked). Tepung isn\'t on that rule, so it keeps Automatic.', ac: 'AC4', run: () => { openTx('po'); S.tx.contact = 'V1'; addLine('P01', 10); addLine('P02', 2); S.tx.pick = 101; reapply(true); render(); } },
  { t: '"No price rule"', e: 'No rule on any line; base purchase prices.', ac: 'AC5', run: () => { openTx('po'); S.tx.contact = 'V1'; addLine('P01', 10); addLine('P05', 3); S.tx.pick = 'none'; reapply(true); render(); } },
  { t: 'Category rule (Vendor + category)', e: 'CK Bandung + Bawang Putih → 5% from "bumbu 5%". Editable: type another discount to see "Edited manually" + Reset.', ac: 'AC1 · AC8', run: () => { openTx('po'); S.tx.contact = 'V1'; addLine('P05', 4); addLine('P06', 1); reapply(true); render(); } },
  { t: 'Live category scope', e: 'Adds "Saus Sambal 1 L" to Bumbu, then orders it from CK Bandung → 5% without touching the rule.', ac: 'AC7b', run: () => { if (!DB.products.some((p) => p.name === 'Saus Sambal 1 L')) DB.products.push({ id: 'P' + String(nextProdId++).padStart(2, '0'), name: 'Saus Sambal 1 L', category: 'Bumbu', buy: 28000, sell: 34000 }); openTx('po'); S.tx.contact = 'V1'; addLine(DB.products.find((p) => p.name === 'Saus Sambal 1 L').id, 6); reapply(true); render(); toast('Saus Sambal 1 L added to Bumbu'); } },
  { t: 'Quantity tiers, locked', e: 'PT Kemasan Prima + Cup Kertas: qty 5 → 0%, change qty to 60 → 8%. Price and discount read-only.', ac: 'AC6 · AC8', run: () => { openTx('po'); S.tx.contact = 'V4'; addLine('P07', 5); addLine('P08', 3); reapply(true); render(); } },
  { t: 'Precedence', e: 'UD Sumber Sayur + Kantong Plastik: the vendor-only 3% rule beats the all-vendors Kemasan category rule (Rp 2.000/unit).', ac: 'AC3 · AC7c', run: () => { openTx('po'); S.tx.contact = 'V3'; addLine('P08', 5); addLine('P04', 10); reapply(true); render(); } },
  { t: 'Non-PKP vendor (vendor master)', e: 'UD Sumber Sayur is Non-PKP: every line shows Non-taxable, PPN total is 0; its rule still applies. Change PKP status under Vendors.', ac: 'AC9', run: () => { openTx('pi'); S.tx.contact = 'V3'; addLine('P04', 10); addLine('P03', 5); reapply(true); render(); } },
  { t: 'Sales parity', e: 'Sales Order, Outlet Kemang: markup 10% on everything. Catering Sejahtera: its price list. Big Bahan Baku orders get the subtotal tier.', ac: 'AC12', run: () => { openTx('so'); S.tx.contact = 'C2'; addLine('P01', 20); addLine('P06', 2); reapply(true); render(); } },
  { t: 'Create a purchase price list', e: 'New rule → Purchase → "Fixed price per product": category choice disappears, a price per product is required.', ac: 'AC7a', run: () => { S.form = blankForm('purchase'); S.form.type = 'fixed_price'; S.form.allContacts = false; S.form.allProducts = false; S.form.name = 'CK Jakarta · price list Des 2026'; S.form.contacts = ['V2']; S.formErr = {}; go('ruleForm'); } },
];
function renderGuide() {
  const g = $('#guide'); g.classList.toggle('hide', !S.guide);
  g.innerHTML = `<h3>Demo steps</h3><div class="quiet">Click <b>Run</b> to set up each scenario. Switch Jurnal / Mekari ERP at the top: same behaviour, each product's own labels.</div>
  ${STEPS.map((s, i) => `<div class="step"><div class="t">${i + 1}. ${esc(s.t)}</div><div class="e">${esc(s.e)}</div><div style="display:flex;align-items:center"><span class="ac">${s.ac}</span><span style="flex:1"></span><button class="btn sm" data-step="${i}">Run</button></div></div>`).join('')}
  <div class="legend"><b>Precedence (no stacking)</b><br>1 Contact + product › 2 Contact + category › 3 Contact, all products › 4 Product only › 5 Category only. Ties → newest rule. A rule picked in the <b>Price rule</b> field wins on the lines it covers.<br><br><b>Not in this prototype</b>: PR visibility for outlet users, import/API, saved-document edit flows.</div>`;
}

/* ═════════════════════════ EVENTS ═════════════════════════ */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-nav],[data-act],[data-edit],[data-filter],[data-step],[data-reset],[data-ldel],[data-deltier],#prodSeg button,#resetBtn,#guideBtn');
  if (!el) return;
  if (el.matches('#prodSeg button')) { S.product = el.dataset.p; return render(); }
  if (el.id === 'resetBtn') { DB = SEED(); S.tx = null; toast('Mock data reset'); return go('rules'); }
  if (el.id === 'guideBtn') { S.guide = !S.guide; return renderGuide(); }
  if (el.dataset.nav) return el.dataset.nav === 'sales' ? openTx('so') : el.dataset.nav === 'purchases' ? openTx('po') : go(el.dataset.nav);
  if (el.dataset.filter) { S.filter = el.dataset.filter; return render(); }
  if (el.dataset.edit) return openForm(Number(el.dataset.edit));
  if (el.dataset.step) return STEPS[Number(el.dataset.step)].run();
  if (el.dataset.reset !== undefined) { const l = S.tx.lines[Number(el.dataset.reset)]; l.manual = false; reapply(); return render(); }
  if (el.dataset.ldel !== undefined) { S.tx.lines.splice(Number(el.dataset.ldel), 1); reapply(); return render(); }
  if (el.dataset.deltier !== undefined) { S.form.tiers.splice(Number(el.dataset.deltier), 1); return render(); }
  const a = el.dataset.act;
  if (a === 'newRule') { S.form = blankForm(S.filter === 'purchase' ? 'purchase' : 'sales'); S.formErr = {}; return go('ruleForm'); }
  if (a === 'cancelForm') { S.form = null; return go('rules'); }
  if (a === 'saveRule') return saveRule();
  if (a === 'delRule') { DB.rules = DB.rules.filter((r) => r.id !== S.form.id); toast('Price rule deleted'); S.form = null; return go('rules'); }
  if (a === 'addTier') { S.form.tiers.push({ t: 0, d: 0 }); return render(); }
  if (a === 'addLine') { addLine(); return render(); }
  if (a === 'addProduct') { const n = $('#npName').value.trim(); if (!n) return; DB.products.push({ id: 'P' + String(nextProdId++).padStart(2, '0'), name: n, category: $('#npCat').value, buy: Number($('#npBuy').value) || 0, sell: Number($('#npSell').value) || 0 }); toast(`${n} added to ${$('#npCat').value}`); return render(); }
});
document.addEventListener('change', (ev) => {
  const el = ev.target, f = S.form;
  if (el.dataset.f && f) {
    const k = el.dataset.f;
    if (k === 'tx') { f.tx = el.value; f.contacts = []; f.prices = {}; f.categories = []; f.products = []; }
    else if (k === 'type') { const was = f.type; f.type = el.value; if (el.value === 'fixed_price' && was !== 'fixed_price') { if (f.categories.length || f.allProducts) toast('Fixed price is set per product: categories / All products removed'); f.categories = []; f.allProducts = false; } if (SHAPE[el.value] === 'tier' && !f.tiers.length) f.tiers = [{ t: 0, d: 0 }]; }
    else if (k === 'allow' || k === 'active') f[k] = el.checked;
    else f[k] = el.value;
    return render();
  }
  if (el.dataset.cs && f) { f.allContacts = el.dataset.cs === 'all'; return render(); }
  if (el.dataset.ps && f) { f.allProducts = el.dataset.ps === 'all'; return render(); }
  if (el.dataset.fcontact && f) { const id = el.dataset.fcontact; f.contacts = el.checked ? [...f.contacts, id] : f.contacts.filter((x) => x !== id); return; }
  if (el.dataset.fcat && f) { const c = el.dataset.fcat; f.categories = el.checked ? [...f.categories, c] : f.categories.filter((x) => x !== c); return; }
  if (el.dataset.fprod && f) { const id = el.dataset.fprod; f.products = el.checked ? [...f.products, id] : f.products.filter((x) => x !== id); return render(); }
  if (el.dataset.fprice && f) { f.prices[el.dataset.fprice] = Number(String(el.value).replace(/\D/g, '')); return; }
  if (el.dataset.tier !== undefined && f) { f.tiers[Number(el.dataset.tier)][el.dataset.k] = Number(el.value); return; }
  if (el.dataset.pkp) { DB.vendors.find((v) => v.id === el.dataset.pkp).pkp = el.value === '1'; toast('PKP status saved. Applies to new transactions.'); return render(); }
  if (el.matches('[data-txdoc]')) { const keep = S.tx.lines.filter((l) => l.pid).map((l) => [l.pid, l.qty]); const wasSales = S.tx.doc === 'so'; openTx(el.value); if (wasSales === (el.value === 'so')) keep.forEach(([p, q]) => addLine(p, q)); reapply(true); return render(); }
  if (el.matches('[data-txcontact]')) { S.tx.contact = el.value; S.tx.pick = 'auto'; reapply(); return render(); }
  if (el.matches('[data-txpick]')) { S.tx.pick = el.value === 'auto' || el.value === 'none' ? el.value : Number(el.value); reapply(); return render(); }
  if (el.dataset.lp !== undefined) { const l = S.tx.lines[Number(el.dataset.lp)]; l.pid = el.value; l.manual = false; l.price = el.value ? baseOf(el.value) : 0; l.disc = 0; reapply(); return render(); }
  if (el.dataset.lq !== undefined) { S.tx.lines[Number(el.dataset.lq)].qty = Math.max(0, Number(el.value) || 0); reapply(); return render(); }
  if (el.dataset.lu !== undefined || el.dataset.ld !== undefined) {
    const i = Number(el.dataset.lu ?? el.dataset.ld), l = S.tx.lines[i], v = Number(String(el.value).replace(',', '.')) || 0;
    if (l.match && !l.match.editable) return render();
    if (el.dataset.lu !== undefined) l.price = v; else l.disc = Math.min(Math.max(v, 0), 100);
    if (l.match) l.manual = l.price !== l.match.price || l.disc !== l.match.disc;
    return render();
  }
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (el.id === 'ruleSearch') { S.search = el.value; const pos = el.selectionStart; render(); const n = $('#ruleSearch'); n.focus(); n.setSelectionRange(pos, pos); }
  if (el.dataset.f === 'name' && S.form) S.form.name = el.value;
});
render();
</script>
</body>
</html>
