name: CI

# Gate every change into main: the Vitest suite must pass AND no new Pixel
# token/component violations may be introduced. Make this a required status
# check in the branch-protection settings so a red run blocks the merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    name: Test suite + Pixel Police
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
        # No npm cache / npm ci: this repo gitignores package-lock.json and pins
        # its Pixel deps to `latest`, so there is no lockfile to cache or ci-install.

      - name: Install dependencies
        # --legacy-peer-deps: the file: local package (@ds/proto-review) trips
        # npm's peer resolver ("edgesOut" crash) on a fresh, lockfile-less install.
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Nuxt types (.nuxt/tsconfig.json)
        # tsconfig extends ./.nuxt/tsconfig.json, which Nuxt generates; without it
        # vitest can't transform any spec. .nuxt/ is gitignored, so build it here.
        run: npx nuxt prepare

      - name: Test suite (Vitest)
        run: npm test

      - name: Pixel Police — token/component check on changed .vue
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          bash scripts/pixel-police-ci.sh "$BASE"
